name: Bug Report
description: Report a crash, connection issue, or unexpected behavior in NavBeam
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please attach the diagnostics `.zip` from **Menu → Diagnostics & Bug Reports** if available. Never share API keys or proprietary files.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open NavBeam...
        2. Tap...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone & Android Version
      placeholder: "e.g., Pixel 8 / Android 15"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: NavBeam Version
      placeholder: "e.g., 1.3.4"
